name: Render CHXCHX animated header
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/header-original.png'
      - 'scripts/generate_header_glitch.py'
      - '.github/workflows/header-glitch.yml'

permissions:
  contents: write

concurrency:
  group: profile-header
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Render if original banner is available
        run: |
          if [ -f assets/header-original.png ]; then
            python scripts/generate_header_glitch.py
          else
            echo 'Upload assets/header-original.png to activate the animation.'
          fi
      - name: Commit rendered GIF and README
        run: |
          if [ -f assets/header-glitch.gif ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add assets/header-glitch.gif README.md
            if ! git diff --cached --quiet; then
              git commit -m 'feat(profile): show original animated CHXCHX header'
              git pull --rebase
              git push
            fi
          fi
