name: Update CHXCHX terminal GIF
on:
  workflow_dispatch:
  schedule:
    - cron: '43 9 * * 1'
permissions:
  contents: write
concurrency:
  group: profile-terminal
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Generate GIF locally
        run: python scripts/generate_terminal.py
      - name: Commit GIF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/terminal.gif
          if ! git diff --cached --quiet; then
            git commit -m 'chore(profile): refresh terminal GIF'
            git pull --rebase
            git push
          fi
