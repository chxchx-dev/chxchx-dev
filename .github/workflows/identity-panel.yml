name: Render CHXCHX identity PNG

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/identity-stack.svg'
      - 'scripts/render_identity.py'
      - '.github/workflows/identity-panel.yml'

permissions:
  contents: write

concurrency:
  group: chxchx-identity-panel
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install rendering dependencies
        run: python -m pip install --disable-pip-version-check CairoSVG==2.9.1 Pillow==11.3.0
      - name: Render and validate
        run: python scripts/render_identity.py
      - name: Commit rendered PNG
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/identity-stack.png
          if ! git diff --cached --quiet; then
            git commit -m 'fix(profile): publish GitHub-compatible identity PNG'
            git pull --rebase
            git push
          fi
