name: CHXCHX 3D contributions
on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-3d.yml'
      - 'setting.json'
permissions:
  contents: write
concurrency:
  group: profile-3d
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Generate contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: setting.json
      - name: Commit generated graph
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile-3d-contrib/
          if ! git diff --cached --quiet; then
            git commit -m 'chore(profile): refresh 3D contributions'
            git pull --rebase
            git push
          fi
