name: CHXCHX Activity Signal

on:
  workflow_dispatch:
  schedule:
    - cron: '29 8 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/generate_activity.py'
      - '.github/workflows/activity-signal.yml'

permissions:
  contents: write

concurrency:
  group: chxchx-activity-signal
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install rendering dependencies
        run: python -m pip install --disable-pip-version-check CairoSVG==2.9.1 Pillow==11.3.0
      - name: Generate verified activity panel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python scripts/generate_activity.py
      - name: Commit generated data visualization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity-signal.svg assets/activity-signal.png
          if ! git diff --cached --quiet; then
            git commit -m 'chore(profile): refresh CHXCHX signal'
            git pull --rebase
            git push
          fi
